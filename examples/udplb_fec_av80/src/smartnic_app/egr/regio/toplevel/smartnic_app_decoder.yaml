name: smartnic_app

blocks:
  smartnic_app_igr: &smartnic_app_igr
    !include ../examples/p4_multi_proc/src/p4_multi_proc/regio/smartnic_app_igr.yaml
  smartnic_app_egr: &smartnic_app_egr
    !include ../examples/p4_multi_proc/src/p4_multi_proc/regio/smartnic_app_egr.yaml
  empty: &empty
    name: empty
    info: Empty register block. Used only as placeholder.
    regs: []

interfaces:

  - block: *empty
    address: 0x000000
    width: 19
    name: igr_extern

  - block: *empty
    address: 0x080000
    width: 19
    name: egr_extern

  - block: *smartnic_app_igr
    address: 0x100000
    width: 19
    name: smartnic_app_igr

  - block: *smartnic_app_egr
    address: 0x180000
    width: 19
    name: smartnic_app_egr

