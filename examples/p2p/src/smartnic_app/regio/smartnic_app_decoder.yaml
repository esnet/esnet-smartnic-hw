name: smartnic_app

blocks:
  p2p: &p2p
    !include ../examples/p2p/src/p2p/regio/p2p.yaml
  empty: &empty
    name: empty
    info: Empty register block. Used only as placeholder.
    regs: []

interfaces:

  - block: *empty
    address: 0x000000
    width: 19
    name: igr_extern

  - block: *empty
    address: 0x080000
    width: 19
    name: egr_extern

  - block: *p2p
    address: 0x100000
    width: 19
    name: smartnic_app_igr

  - block: *empty
    address: 0x180000
    width: 19
    name: empty

