name: smartnic_app

blocks:
  empty: &empty
    name: empty
    info: |
      Placeholder for empty block.
    regs: []

decoders:
  sar_test_decoder: &sar_test_decoder
    !include ../examples/sar_test/src/sar_test/regio/sar_test_decoder.yaml

interfaces:
  - block: *empty
    address: 0x00000
    width: 16
    name: igr_extern
  - block: *empty
    address: 0x10000
    width: 16
    name: egr_extern
  - decoder: *sar_test_decoder
    address: 0x20000
    width: 17
    name: smartnic_app_igr
  - block: *empty
    address: 0x40000
    width: 16
    name: smartnic_app_egr
