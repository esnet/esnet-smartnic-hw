name: smartnic_app

blocks:
  empty: &empty
    name: empty
    info: |
      Placeholder for empty block.
    regs: []

decoders:
  sar_test_decoder: &sar_test_decoder
    !include ../examples/sar_test/src/sar_test/regio/sar_test_decoder.yaml

interfaces:
  - block: *empty
    address: 0x000000
    width: 19
    name: igr_extern
  - block: *empty
    address: 0x080000
    width: 19
    name: egr_extern
  - decoder: *sar_test_decoder
    address: 0x100000
    width: 19
    name: smartnic_app_igr
  - block: *empty
    address: 0x180000
    width: 19
    name: smartnic_app_egr
