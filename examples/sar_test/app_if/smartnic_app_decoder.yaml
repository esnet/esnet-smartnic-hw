      packet_capture: &id027
        blocks:
          capture: &id004
            info: 'This register map describes a register block for

              control of a packet capture (extraction) function.

              '
            name: packet_capture
            regs:
            - default:
                access: rw
                init: 0
                width: 32
            - access: ro
              desc: Info (provides parameterization details).
              fields:
              - desc: packet data RAM size (in bytes)
                name: mem_size
                width: 20
              - desc: width of (opaque) packet metadata (in bits).
                name: meta_width
                width: 10
              name: info
            - access: rw
              fields:
              - desc: soft reset.
                init: 0
                name: reset
                width: 1
              - desc: enable capture function. Controls an output pin that could (e.g.)
                  drive an output select demux.
                init: 0
                name: enable
                width: 1
              name: control
            - access: ro
              fields:
              - desc: reset status
                name: reset
                width: 1
              - desc: memory init done
                name: init_done
                width: 1
              name: monitor
            - access: wr_evt
              desc: Command register
              fields:
              - desc: Command code.
                enum:
                  0: NOP
                  1: CAPTURE
                name: code
                width: 8
              name: command
            - access: rd_evt
              desc: Capture status register.
              fields:
              - desc: Status code.
                enum:
                  0: RESET
                  1: DISABLED
                  2: READY
                  3: BUSY
                name: code
                width: 8
              - desc: Done flag. Indicates that last operation completed successfully.
                  Sticky until read or until new transaction received.
                name: done
                width: 1
              - desc: Error flag. Indicates that last operation terminated with error.
                  Sticky until read or until new transaction received.
                name: error
                width: 1
              - desc: Reserved field.
                name: rsvd
                width: 6
              - desc: Number of bytes received in last capture.
                name: packet_bytes
                width: 16
              name: status
            - access: ro
