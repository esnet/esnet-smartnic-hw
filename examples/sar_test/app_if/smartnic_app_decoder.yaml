                  1: DISABLED
                  2: READY
                  3: BUSY
                name: code
                width: 8
              - desc: Done flag. Indicates that last operation completed successfully.
                  Sticky until read or until new transaction received.
                name: done
                width: 1
              - desc: Error flag. Indicates that last operation terminated with error.
                  Sticky until read or until new transaction received.
                name: error
                width: 1
              - desc: Timeout flag. Indicates that last operation timed out. Sticky
                  until read or until new transaction received.
                name: timeout
                width: 1
              name: status
            - access: rw
              count: 8
              desc: metadata register. Sets value of metadata accompanying packet
                data. Implemented as a byte array, where - meta[0].byte_0 contains
                byte 0 of metadata. meta[(info.meta_size-1) div 32].byte_(((info.meta_size-1)
                div 8) mod 4) contains last byte of write data. meta[i, i > (info.meta_size-1)
                div 32] are ignored.
