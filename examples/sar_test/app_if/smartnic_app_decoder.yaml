                name: enable
                width: 1
              name: control
            - access: ro
              fields:
              - desc: reset status
                name: reset
                width: 1
              - desc: memory init done
                name: init_done
                width: 1
              name: monitor
            - access: wr_evt
              desc: Command register
              fields:
              - desc: Command code.
                enum:
                  0: NOP
                  1: SEND_ONE
                  2: SEND_BURST
                  3: SEND_CONTINUOUS
                  4: STOP
                name: code
                width: 8
              name: command
            - access: rw
              desc: Playback config register.
              fields:
              - desc: Packet size in bytes. This number of bytes are read from the
                  accompanying packet data memory and transmitted.
                init: 0
                name: packet_bytes
                width: 16
              - desc: Number of packets in burst (only applies when command.code ==
                  SEND_BURST).
                init: 1
                name: burst_size
                width: 16
              name: config
            - access: rd_evt
              desc: Status register
              fields:
              - desc: Status code.
