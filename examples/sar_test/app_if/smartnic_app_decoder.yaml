                div 8) mod 4) contains last byte of metadata. meta[i, i > (info.meta_size-1)
                div 32] are ignored.
              fields:
              - desc: 0th byte of selected dword
                name: byte_0
                width: 8
              - desc: 1st byte of selected dword
                name: byte_1
                width: 8
              - desc: 2nd byte of selected dword
                name: byte_2
                width: 8
              - desc: 3rd byte of selected dword
