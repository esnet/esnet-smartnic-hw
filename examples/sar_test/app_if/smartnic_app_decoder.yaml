    blocks:
      mem_proxy: &id003
        info: 'This register map describes a register-indirect proxy interface

          for interacting with a generic memory.

          '
        name: mem_proxy
        protocol:
          name: mem_proxy
          source:
            data: "#---------------------------------------------------------------------------------------------------\n\
              __all__ = (\n    'Protocol',\n)\n\nimport enum\nimport time\nimport\
              \ types\n\nfrom regio.regmap.io import methods\n\n#---------------------------------------------------------------------------------------------------\n\
              class Protocol(methods.Protocol):\n    # TODO: Remove once enums are\
              \ auto-generated for the Python library.\n    class CommandCode(enum.IntEnum):\n\
              \        NOP = 0\n        READ = 1\n        WRITE = 2\n        CLEAR\
              \ = 3\n\n    class StatusCode(enum.IntEnum):\n        RESET = 0\n  \
              \      READY = 1\n        BUSY = 2\n\n    def __init__(self, spec, if_name,\
              \ timeout=100e-3, delay=1e-3):\n        super().__init__(spec, if_name)\n\
              \n        if timeout is None:\n            self.wait_count = None\n\
              \        elif timeout < delay:\n            raise ValueError(f'Timeout\
              \ {timeout} must be greater than the delay of {delay}')\n        elif\
              \ delay > 0:\n            self.wait_delay = delay\n            self.wait_count\
              \ = int(timeout / delay)\n        else:\n            self.wait_delay\
              \ = 0\n            self.wait_count = 0\n\n    def _wait_status(self,\
              \ proxy, test):\n        count = self.wait_count\n        while True:\n\
              \            status = proxy.status().proxy\n            if test(status):\n\
              \                return status\n\n            if count is None: # Loop\
              \ infinitely for condition...\n                continue\n\n        \
              \    if count <= 0:\n                return None\n            count\
              \ -= 1\n            time.sleep(self.wait_delay)\n\n    def _transact(self,\
              \ proxy, offset, value):\n        do_write = value is not None\n   \
              \     if do_write:\n            cmd_code = self.CommandCode.WRITE\n\
              \            err_msg = f'writing value 0x{value:x} to memory word 0x{offset:x}'\n\
              \        else:\n            cmd_code = self.CommandCode.READ\n     \
              \       err_msg = f'reading from memory word 0x{offset:x}'\n\n     \
              \   # Setup for the transaction.\n        status = self._wait_status(proxy,\
              \ lambda st: st.code == self.StatusCode.READY)\n        if status is\
              \ None:\n            raise TimeoutError('Controller not ready for '\
              \ + err_msg)\n\n        proxy.addr = offset # Memory address expected\
              \ in words, not bytes.\n        if do_write:\n            for data in\
              \ proxy.wr_data[:self._ctx.data_count]:\n                data._r = value\
              \ & self._ctx.data_mask\n                value >>= self._ctx.data_width\n\
              \n        # Trigger the transaction.\n        cmd = proxy.command(0).proxy\n\
              \        cmd.code = int(cmd_code)\n        proxy.command = int(cmd)\n\
              \n        # Wait for the transaction to complete.\n        status =\
              \ self._wait_status(proxy, lambda st: st.done or st.timeout or st.error)\n\
              \        if status is None:\n            raise TimeoutError('Controller\
              \ timeout when ' + err_msg)\n        if status.timeout:\n          \
              \  raise TimeoutError('Transaction timeout when ' + err_msg)\n     \
              \   if status.error:\n            raise IOError('Transaction error '\
              \ + err_msg)\n        if status.burst_size != self._ctx.data_size:\n\
              \            raise IOError('Transaction size mismatch ' + err_msg +\n\
              \                          f' [expected {self._ctx.data_size}, got {int(status.burst_size)}]')\n\
              \n        # Read the data fetched by the transaction.\n        if not\
              \ do_write:\n            value = 0\n            for data in reversed(proxy.rd_data[:self._ctx.data_count]):\n\
              \                value <<= self._ctx.data_width\n                value\
              \ |= int(data._r) & self._ctx.data_mask\n            return value\n\n\
              \    def start(self, proxy):\n        # TODO: Get data_width from controller\
              \ proxy's spec region info. Add property to variable to\n        # \
              \      get the spec? Something like:\n        # from regio.regmap.spec\
              \ import info\n        # ctx.data_width = info.data_width_of(proxy().spec)\n\
              \        ctx = types.SimpleNamespace()\n        ctx.data_width = 32\n\
              \        ctx.data_mask = (1 << ctx.data_width) - 1\n        ctx.data_size\
              \ = int(proxy.info_burst.min)\n        ctx.data_count = ctx.data_size\
              \ // (ctx.data_width // 8)\n        self._ctx = ctx\n\n        proxy.burst.len\
              \ = 1 # Restrict burst operations to a single word.\n        super().start(proxy)\n\
              \n    def stop(self, proxy):\n        super().start(proxy)\n       \
              \ del self._ctx\n\n    def read(self, proxy, offset, size):\n      \
              \  return self._transact(proxy, offset, None)\n\n    def write(self,\
              \ proxy, offset, size, value):\n        self._transact(proxy, offset,\
              \ int(value))\n"
        regs:
        - default:
            access: rw
            init: 0
            width: 32
        - access: ro
          desc: Info (type)
          fields:
          - desc: underlying memory type.
            enum:
              0: UNSPECIFIED
              1: SRAM
              2: DDR
              3: HBM
            name: mem_type
            width: 4
          - desc: access type.
            enum:
              0: UNSPECIFIED
              1: READ_WRITE
              2: READ_ONLY
            name: access
            width: 4
          - desc: alignment (in bytes) for memory accesses.
            name: alignment
            width: 12
          name: info
        - access: ro
          desc: Info (depth)
          fields:
          - desc: memory depth in words
            name: words
            width: 32
          name: info_depth
        - access: ro
          desc: Info (size in bytes, bits 63:32)
          name: info_size_upper
          width: 32
        - access: ro
          desc: Info (size in bytes, bits 31:0)
          name: info_size_lower
          width: 32
        - access: ro
          desc: Info (burst)
          fields:
          - desc: minimum burst size (in bytes)
            name: min
            width: 9
          - desc: reserved
            name: rsvd0
            width: 7
          - desc: maximum burst size (in bytes)
            name: max
            width: 9
          - desc: reserved
            name: rsvd1
            width: 7
          name: info_burst
        - access: rw
          desc: Block control register
          fields:
          - desc: (Soft) block reset.
            init: 0
            name: reset
            width: 1
          - desc: (Soft) block enable.
            init: 1
            name: enable
            width: 1
          name: control
        - access: ro
          desc: Block monitor register
          fields:
          - desc: Block reset monitor.
            name: reset_mon
            width: 1
          - desc: Block enable monitor.
            name: enable_mon
            width: 1
          - desc: Block ready monitor.
            name: ready_mon
            width: 1
          - desc: Block state monitor.
            enum:
              0: RESET
              1: INIT_DEBOUNCE
              2: INIT_PENDING
              3: IDLE
              4: READ_REQ
              5: READ_PENDING
              6: WRITE_REQ
              7: WRITE_PENDING
              8: CLEAR_REQ
              9: CLEAR_DEBOUNCE
              10: CLEAR_PENDING
              11: DONE
              12: ERROR
              13: TIMEOUT
            name: state_mon
            width: 8
          name: monitor
        - access: wr_evt
          desc: Command register
          fields:
          - desc: Command code.
            enum:
              0: NOP
              1: READ
              2: WRITE
              3: CLEAR
            name: code
            width: 8
          name: command
        - access: rd_evt
          desc: Status register
          fields:
          - desc: Status code.
            enum:
              0: RESET
              1: READY
              2: BUSY
            name: code
            width: 8
          - desc: Done flag. Indicates that last operation completed successfully.
              Sticky until read or until new transaction received.
            name: done
            width: 1
          - desc: Error flag. Indicates that last operation terminated with error.
              Sticky until read or until new transaction received.
            name: error
            width: 1
          - desc: Timeout flag. Indicates that last operation timed out. Sticky until
              read or until new transaction received.
            name: timeout
            width: 1
          - desc: Number of bytes written/read in last successful operation; For READ
              operations, specifies the number of valid bytes in the read_data array.
            name: burst_size
            width: 9
          - desc: reserved
            name: rsvd
            width: 7
          name: status
        - access: rw
          desc: Address register (for READ/WRITE operations). Must be aligned according
            to info.alignment.
          name: addr
          width: 32
        - desc: Burst config register (for READ/WRITE operations).
          fields:
          - desc: Burst length for READ/WRITE operations only (ignored for other operations).
              Overall burst size is burst.len * info_burst.min (bytes). A value of
              0 is equivalent to no burst, i.e. burst length == 1.
            name: len
            width: 8
          name: burst
        - access: rw
          count: 16
          desc: Write data register (for WRITE operations). Implemented as a byte
            array, where - write_data[0].byte_0 contains byte 0 of write data. write_data[(command.burst_size-1)
            div 4].byte_((command.burst_size-1) mod 4) contains last byte of write
            data. write_data[i, i > (command.burst_size-1) div 4] are ignored.
          fields:
          - desc: 0th byte of selected dword
            name: byte_0
            width: 8
          - desc: 1st byte of selected dword
            name: byte_1
            width: 8
          - desc: 2nd byte of selected dword
            name: byte_2
            width: 8
          - desc: 3rd byte of selected dword
            name: byte_3
            width: 8
          name: wr_data
        - access: ro
          count: 16
          desc: Read data register (for READ operations). Implemented as a byte array,
            where - read_data[0].byte_0 contains byte 0 of read data. read_data[(status.burst_size-1)
            div 4].byte_((status.burst_size-1) mod 4) contains last byte of read data.
            read_data[i, i > (status.burst_size-1) div 4] are ignored.
          fields:
          - desc: 0th byte of selected dword
            name: byte_0
            width: 8
          - desc: 1st byte of selected dword
            name: byte_1
            width: 8
          - desc: 2nd byte of selected dword
            name: byte_2
            width: 8
          - desc: 3rd byte of selected dword
            name: byte_3
            width: 8
          name: rd_data
