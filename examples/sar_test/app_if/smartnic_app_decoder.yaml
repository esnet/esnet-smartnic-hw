        blocks:
          proxy_reg: &id002
            info: 'This block describes a register-indirect proxy interface, to

              be used, e.g., for mapping large (or sparse) memory address spaces

              into a memory window that can be accommodated in a small register

              map.

              '
            name: reg_proxy
            protocol:
              name: reg_proxy
              source:
                data: "#---------------------------------------------------------------------------------------------------\n\
                  __all__ = (\n    'Protocol',\n)\n\nimport time\n\nfrom regio.regmap.io\
                  \ import methods\n\n#---------------------------------------------------------------------------------------------------\n\
                  class Protocol(methods.Protocol):\n    def __init__(self, spec,\
                  \ if_name, timeout=100e-3, delay=1e-3):\n        super().__init__(spec,\
                  \ if_name)\n\n        if timeout is None:\n            self.wait_count\
                  \ = None\n        elif timeout < delay:\n            raise ValueError(f'Timeout\
                  \ {timeout} must be greater than the delay of {delay}')\n      \
                  \  elif delay > 0:\n            self.wait_delay = delay\n      \
                  \      self.wait_count = int(timeout / delay)\n        else:\n \
                  \           self.wait_delay = 0\n            self.wait_count = 0\n\
                  \n    def _wait_status(self, proxy, test):\n        count = self.wait_count\n\
                  \        while True:\n            status = proxy.status().proxy\n\
                  \            if test(status):\n                return status\n\n\
                  \            if count is None: # Loop infinitely for condition...\n\
                  \                continue\n\n            if count <= 0:\n      \
                  \          return None\n            count -= 1\n            time.sleep(self.wait_delay)\n\
                  \n    def _transact(self, proxy, offset, value):\n        addr =\
                  \ offset << 2 # Register offset given in words, not bytes.\n   \
                  \     do_write = value is not None\n        if do_write:\n     \
                  \       err_msg = f'writing value 0x{value:x} to register address\
                  \ 0x{addr:x}'\n        else:\n            err_msg = f'reading from\
                  \ register address 0x{addr:x}'\n\n        # Setup for the transaction.\n\
                  \        status = self._wait_status(proxy, lambda st: st.ready)\n\
                  \        if status is None:\n            raise TimeoutError('Controller\
                  \ not ready for ' + err_msg)\n\n        proxy.address = addr\n \
                  \       if do_write:\n            proxy.wr_data = value\n\n    \
                  \    # Trigger the transaction.\n        cmd = proxy.command(0).proxy\n\
                  \        cmd.wr_rd_n = int(do_write)\n        proxy.command = int(cmd)\n\
                  \n        # Wait for the transaction to complete.\n        status\
                  \ = self._wait_status(proxy, lambda st: st.done or st.error)\n \
                  \       if status is None:\n            raise TimeoutError('Controller\
                  \ timeout when ' + err_msg)\n        if status.error:\n        \
                  \    raise IOError('Transaction error ' + err_msg)\n\n        #\
                  \ Read the data fetched by the transaction.\n        if not do_write:\n\
                  \            return int(proxy.rd_data)\n\n    def start(self, proxy):\n\
                  \        proxy.wr_byte_en = 0xf # Enable all byte lanes for writing.\n\
                  \        super().start(proxy)\n\n    def read(self, proxy, offset,\
                  \ size):\n        return self._transact(proxy, offset, None)\n\n\
                  \    def write(self, proxy, offset, size, value):\n        self._transact(proxy,\
                  \ offset, int(value))\n"
            regs:
            - default:
                access: ro
                init: 0
                width: 32
            - access: wr_evt
              desc: Command register.
              fields:
              - desc: Write when asserted, read when deasserted.
                init: 0
                name: wr_rd_n
                width: 1
              name: command
            - access: rd_evt
              desc: Status register
              fields:
              - desc: Ready for next transaction.
                name: ready
                width: 1
              - desc: Completion flag; indicates that the last transaction completed.
                name: done
                width: 1
              - desc: Error flag; indicates that the last transaction resulted in
                  an error. Clear on read.
                name: error
                width: 1
              name: status
            - access: rw
              desc: Address register.
              init: 0
              name: address
            - access: rw
              desc: Write data register
              init: 0
              name: wr_data
            - access: rw
              desc: Write byte enable register
              fields:
              - desc: Byte 0 enable
                init: 1
                name: byte_0
                width: 1
              - desc: Byte 1 enable
                init: 1
                name: byte_1
                width: 1
              - desc: Byte 2 enable
                init: 1
                name: byte_2
                width: 1
              - desc: Byte 3 enable
                init: 1
                name: byte_3
                width: 1
              name: wr_byte_en
            - access: ro
              desc: Read data register
              name: rd_data
