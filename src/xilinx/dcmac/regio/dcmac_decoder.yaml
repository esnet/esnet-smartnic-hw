name: dcmac
visible: true

blocks:
  dcmac_regs: &dcmac_regs
    !include ../src/xilinx/dcmac/regio/dcmac_regs.yaml

decoders:
  dcmac_mac_decoder: &dcmac_mac_decoder
    !include ../src/xilinx/dcmac/regio/dcmac_mac_decoder.yaml
  gtm_decoder: &gtm_decoder
    !include ../src/xilinx/gtm/regio/gtm_decoder.yaml

interfaces:
  - block: *dcmac_regs
    address: 0x000000
    width: 12
    name: regs

  - decoder: *gtm_decoder
    address: 0x004000
    suffix: '0'
    name: gtm

  - decoder: *gtm_decoder
    address: 0x008000
    suffix: '1'
    name: gtm

  - decoder: *dcmac_mac_decoder
    address: 0x040000
    name: mac
