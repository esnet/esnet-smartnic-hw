name: qdma_pkt_playback
visible: true

blocks:
  playback: &playback
    !include ../src/xilinx/qdma/regio/qdma_pkt_playback.yaml
  counters: &counters
    !include ../src/xilinx/qdma/regio/qdma_counters.yaml
  mem: &mem
    !include ../src/xilinx/qdma/regio/qdma_mem_proxy.yaml

interfaces:
  - block: *playback
    width: 8
    address: 0x0000
    name: control
  - block: *counters
    width: 8
    address: 0x0100
    name: counts
  - block: *mem
    address: 0x0400
    width: 10
    name: data
