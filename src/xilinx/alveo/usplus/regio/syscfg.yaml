name: syscfg
info: |
  System config registers
regs:
  - default:
      width: 32

  - name: build_status
    access: ro
  - name: system_reset
    access: wo
    info: Write 1 to trigger the corresponding reset
    fields:
      - name: system_reset
        width: 1
  - name: system_status
    access: ro
    fields:
      - name: system_reset_done
        width: 1
  - name: shell_reset
    access: wo
    info: Write 1 to trigger the corresponding reset
    fields:
      - name: qdma_reset
        width: 1
      - name: cmac0_reset
        width: 1
      - name: cmac1_reset
        width: 1
  - name: shell_status
    access: ro
    fields:
      - name: qdma_reset_done
        width: 1
      - name: cmac0_reset_done
        width: 1
      - name: cmac1_reset_done
        width: 1
  - name: user_reset
    access: wo
    info: Write 1 to trigger the corresponding reset
  - name: user_status
    access: ro
  - name: usr_access
    access: ro
  - name: dna
    access: ro
    count: 3

  - name: vpd_control
    access: rw
    init: 0
    fields:
      - name: init_done_mask
        width: 1
  - name: vpd_status
    access: ro
    fields:
      - name: init_done
        width: 1
      - name: init_error
        width: 1
      - name: init_early_read
        width: 1
      - name: init_time_ms
        width: 14
      - name: card_info_valid
        width: 1
      - name: card_info_length
        width: 8
      - name: error_card_info_length
        width: 1
      - name: error_bad_axil_transaction
        width: 1
      - name: error_boot_timeout
        width: 1
      - name: init_timeout
        width: 1
