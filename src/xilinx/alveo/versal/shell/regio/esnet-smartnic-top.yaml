toplevel:
  name: esnet_smartnic
  info: |
    ESnet SmartNIC FPGA (Versal V80)
  pci_vendor: 0x10ee
  pci_device: 0x9038

  bars:
    0:
      name: bar0
      desc: QDMA DMA registers (CPM5 internal)
      size: 0x00020000
      decoder:
        name: bar0
        decoders:
          cpm5_qdma_pf_decoder: &cpm5_qdma_pf_decoder
            !include ../src/xilinx/alveo/versal/regio/cpm5_qdma_pf_decoder.yaml
        interfaces:
          - decoder: *cpm5_qdma_pf_decoder
            address: 0x000000
    2:
      name: bar2
      desc: all user logic
      size: 0x00800000
      decoder:
        name: bar2
        decoders:
          shell_decoder: &shell_decoder
            !include ../src/xilinx/alveo/versal/shell/regio/shell_decoder_core.yaml
        interfaces:
          - decoder: *shell_decoder
            address: 0x000000
