name: cpm5_qdma_pf_queues
info: |
  CPM5 QDMA Per-Queue (DMAP) Registers
  Ref: PG347, Versal Adaptive SoC CPM DMA and Bridge Mode for PCI Express
  Source: cpm5-qdma-v4-0-vf-registers.csv (DMAP section)
  Note: This block is instantiated once per queue (up to 2048 queues).
regs:
  - default:
      width: 32
      access: rw

  - name: int_cidx
    fields:
      - name: sw_cidx
        width: 16
      - name: ring_idx
        width: 8
      - name: rsvd
        width: 8

  - name: h2c_dsc_pidx
    fields:
      - name: h2c_pidx
        width: 16
      - name: irq_arm
        width: 1
      - name: rsvd
        width: 15

  - name: c2h_dsc_pidx
    fields:
      - name: c2h_pidx
        width: 16
      - name: irq_arm
        width: 1
      - name: rsvd
        width: 15

  - name: cmpt_cidx
    fields:
      - name: wrb_cidx
        width: 16
      - name: c2h_count_threshold
        width: 4
      - name: c2h_timer_cnt_index
        width: 4
      - name: trigger_mode
        width: 3
        enum:
          0x0 : disabled
          0x1 : every
          0x2 : user_count
          0x3 : user
          0x4 : user_timer
          0x5 : user_timer_count
      - name: en_sts_desc_wrb
        width: 1
      - name: irq_en_wrb
        width: 1
      - name: rsvd
        width: 3
