  - name: glbl_dsc_err_msk

  - name: glbl_dsc_err_log0
    fields:
      - name: qid
        width: 13
      - name: rsvd
        width: 17
      - name: sel
        width: 1
        enum:
          0x0 : H2C
          0x1 : C2H
      - name: valid
        width: 1

  - name: glbl_dsc_err_log1
