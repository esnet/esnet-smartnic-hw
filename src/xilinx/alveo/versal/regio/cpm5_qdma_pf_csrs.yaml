      - name: dma
        width: 1
      - name: dsc
        width: 1
      - name: rq_cancel
        width: 1
      - name: rsvd2
        width: 2
      - name: dat_poison2
        width: 1
      - name: flr_cancel2
        width: 1
      - name: dbe
        width: 1
      - name: sbe
        width: 1
      - name: rq_cancel2
