name: cpm5_qdma_pf_csrs
info: |
  CPM5 QDMA PF Device CSRs
  Ref: PG347, Versal Adaptive SoC CPM DMA and Bridge Mode for PCI Express
  Source: cpm5-qdma-v4-0-pf-registers.csv
regs:
  - default:
      width: 32
      access: rw

  # Config Block / GLBL1 (0x000)

  - name: cfg_block_id
    access: ro
    fields:
      - name: version
        width: 8
      - name: rsvd
        width: 8
      - name: config_block_identifier
        width: 4
      - name: identifier
        width: 12

  - meta:
      pad_until: 0x08

  - name: cfg_pcie_max_pl_sz
    fields:
      - name: pcie_max_payload_issued
        width: 3
        access: ro
      - name: rsvd
        width: 1
      - name: pcie_max_payload_prog
        width: 3
      - name: rsvd1
        width: 25

  - name: cfg_pcie_max_rdrq_sz
    fields:
      - name: pcie_max_read_issued
        width: 3
        access: ro
      - name: rsvd
        width: 1
      - name: pcie_max_read_prog
        width: 3
      - name: rsvd1
        width: 25

  - name: cfg_sys_id
    fields:
      - name: system_id
        width: 16
        access: ro
      - name: inst_type
        width: 1
        access: ro
      - name: rsvd
        width: 15

  - name: cfg_msix_en
    access: ro

  - name: cfg_pcie_data_width
    fields:
      - name: datapath_width
        width: 3
        access: ro
        enum:
          0x0 : WIDTH_64
          0x1 : WIDTH_128
          0x2 : WIDTH_256
          0x3 : WIDTH_512
      - name: rsvd
        width: 29

  - name: cfg_pcie_ctrl
    fields:
      - name: relaxed_ordering
        width: 1
      - name: rrq_disable
        width: 1
      - name: rsvd
        width: 14
      - name: mgmt_axil_ctrl
        width: 2
        enum:
          0x0 : RR
          0x1 : MGMT_ONLY
          0x2 : AXIL_ONLY
      - name: rsvd1
        width: 14

  - name: cfg_msi_en
    access: ro

  - meta:
      pad_until: 0x40

  - name: cfg_axi_usr_max_pl_sz
    fields:
      - name: user_max_payload_prog
        width: 3
      - name: rsvd
        width: 1
      - name: user_max_payload_issued
        width: 3
        access: ro
      - name: rsvd1
        width: 25

  - name: cfg_axi_usr_max_rdrq_sz
    fields:
      - name: usr_max_read_request_prog
        width: 3
      - name: rsvd
        width: 1
      - name: usr_max_read_request_issued
        width: 3
        access: ro
      - name: rsvd1
        width: 25

  - meta:
      pad_until: 0x4C

  - name: cfg_misc_ctrl
    fields:
      - name: rq_metering_multiplier
        width: 5
      - name: rsvd
        width: 3
      - name: num_tag
        width: 12
      - name: axi_dsc
        width: 1
      - name: axi_wbk
        width: 1
      - name: rsvd1
        width: 1
      - name: tag_10b_en
        width: 1
      - name: rsvd2
        width: 8

  - meta:
      pad_until: 0x68

  - name: cfg_pl_credit_ctl
    fields:
      - name: master_crd_rst
        width: 1
      - name: rsvd
        width: 3
      - name: slave_crd_rls
        width: 1
      - name: rsvd1
        width: 27

  - meta:
      pad_until: 0x80

  - name: cfg_scratch_reg
    count: 8

  - name: cfg_gic
    fields:
      - name: gic_irq
        width: 1
      - name: rsvd
        width: 31

  - meta:
      pad_until: 0xE0

  - name: qdma_ram_sbe_msk_1_a
  - name: qdma_ram_sbe_sts_1_a
    fields:
      - name: rc_rrq_even_ram
        width: 1
      - name: tag_odd_ram
        width: 1
      - name: tag_even_ram
        width: 1
      - name: pfch_ctxt_cam_ram_0
        width: 1
      - name: pfch_ctxt_cam_ram_1
        width: 1
      - name: rsvd
        width: 27
  - name: qdma_ram_dbe_msk_1_a
  - name: qdma_ram_dbe_sts_1_a
    fields:
      - name: rc_rrq_even_ram
        width: 1
      - name: tag_odd_ram
        width: 1
      - name: tag_even_ram
        width: 1
      - name: pfch_ctxt_cam_ram_0
        width: 1
      - name: pfch_ctxt_cam_ram_1
        width: 1
      - name: rsvd
        width: 27
  - name: qdma_ram_sbe_msk_a
  - name: qdma_ram_sbe_sts_a
  - name: qdma_ram_dbe_msk_a
  - name: qdma_ram_dbe_sts_a

  # GLBL2 (0x100)

  - name: glbl2_identifier
    access: ro
    fields:
      - name: version
        width: 8
      - name: identifier
        width: 24

  - meta:
      pad_until: 0x114

  - name: glbl2_channel_inst
    access: ro
    fields:
      - name: h2c_eng
        width: 4
      - name: rsvd
        width: 4
      - name: c2h_eng
        width: 4
      - name: rsvd1
        width: 4
      - name: h2c_st
        width: 1
      - name: c2h_st
        width: 1
      - name: rsvd2
        width: 14

  - name: glbl2_channel_mdma
    access: ro
    fields:
      - name: h2c_eng
        width: 4
      - name: rsvd
        width: 4
      - name: c2h_eng
        width: 4
      - name: rsvd1
        width: 4
      - name: h2c_st
        width: 1
      - name: c2h_st
        width: 1
      - name: rsvd2
        width: 14

  - name: glbl2_channel_strm
    access: ro
    fields:
      - name: h2c_eng
        width: 4
      - name: rsvd
        width: 4
      - name: c2h_eng
        width: 4
      - name: rsvd1
        width: 4
      - name: h2c_st
        width: 1
      - name: c2h_st
        width: 1
      - name: rsvd2
        width: 14

  - name: glbl2_channel_qdma_cap
    access: ro
    fields:
      - name: multiq_max
        width: 12
      - name: rsvd
        width: 20

  - meta:
      pad_until: 0x128

  - name: glbl2_channel_pasid_cap
    access: ro
    fields:
      - name: dma_pasid_en
        width: 1
      - name: bridge_pasid_en
        width: 1
      - name: rsvd
        width: 30

  - meta:
      pad_until: 0x130

  - name: glbl2_sys_id
    access: ro
    fields:
      - name: system_id
        width: 16
      - name: rsvd
        width: 16

  - name: glbl2_misc_cap
    access: ro

  - meta:
      pad_until: 0x1B8

  - name: glbl2_dbg_pcie_rq
    count: 2
    access: ro
  - name: glbl2_dbg_aximm_wr
    count: 2
    access: ro
  - name: glbl2_dbg_aximm_rd
    count: 2
    access: ro
  - name: glbl2_dbg_fab0
    access: ro
  - name: glbl2_dbg_fab1
    access: ro

  - meta:
      pad_until: 0x1F4

  - name: glbl2_dbg_match_sel
  - name: glbl2_dbg_match_msk
  - name: glbl2_dbg_match_pat

  # GLBL (0x200)

  - meta:
      pad_until: 0x204

  - name: glbl_rngsz
    count: 16
    fields:
      - name: ring_size
        width: 16
      - name: rsvd
        width: 16

  - meta:
      pad_until: 0x248

  - name: glbl_err_stat
    fields:
      - name: err_ram_sbe
        width: 1
      - name: err_ram_dbe
        width: 1
      - name: err_dsc
        width: 1
      - name: err_trq
        width: 1
      - name: err_h2c_mm_0
        width: 1
      - name: err_h2c_mm_1
        width: 1
      - name: err_c2h_mm_0
        width: 1
      - name: err_c2h_mm_1
        width: 1
      - name: err_c2h_st
        width: 1
      - name: ind_ctxt_cmd_err
        width: 6
      - name: err_bdg
        width: 1
      - name: err_h2c_st
        width: 1
      - name: err_fab
        width: 1
      - name: rsvd
        width: 14

  - name: glbl_err_mask

  - name: glbl_dsc_cfg
    fields:
      - name: wb_acc_int
        width: 3
      - name: max_dsc_fetch
        width: 3
      - name: rsvd
        width: 2
      - name: ctxt_fer_dis
        width: 1
      - name: unc_ovr_cor
        width: 1
      - name: rsvd1
        width: 22

  - name: glbl_dsc_err_sts
    fields:
      - name: poison
        width: 1
      - name: ur_ca
        width: 1
      - name: bcnt
        width: 1
      - name: param
        width: 1
      - name: addr
        width: 1
      - name: tag
        width: 1
      - name: flr
        width: 1
      - name: rsvd
        width: 1
      - name: timeout
        width: 1
      - name: dat_poison
        width: 1
      - name: rsvd1
        width: 2
      - name: flr_cancel
