      - name: err_type
        width: 5
      - name: sub_type
        width: 4
        enum:
          0x0 : NON_UPDATE_ERR
          0x2 : PIDX_UPDATE_OVFL
          0x3 : RX_TOO_MANY_CREDITS
          0x4 : FENCED_CREDIT_RX
          0x5 : VIRTIO_AVAIL_PAGE_SPAN
      - name: rsvd
        width: 3
      - name: cidx
        width: 16
      - name: rsvd1
        width: 4

  - name: glbl_trq_err_sts
