name: dcmac_decoder
info: |
  AMD DCMAC Register Decoder.
  Single address space 0x00000-0x28038:
    0x00000: global registers
    0x01000-0x06000: per-channel registers C0-C5 (full featured)
    0x07000-0x28000: per-channel registers C6-C39 (TDM)

blocks:
  dcmac_global: &dcmac_global
    !include ../src/xilinx/alveo/versal/regio/dcmac_global_regs.yaml

  dcmac_channel: &dcmac_channel
    !include ../src/xilinx/alveo/versal/regio/dcmac_channel_regs.yaml

  dcmac_channel_tdm: &dcmac_channel_tdm
    !include ../src/xilinx/alveo/versal/regio/dcmac_channel_tdm_regs.yaml

interfaces:
  - block: *dcmac_global
    address: 0x00000
    width: 9
    name: global

  - block: *dcmac_channel
    address: 0x01000
    width: 12
    name: ch0

  - block: *dcmac_channel
    address: 0x02000
    width: 12
    name: ch1

  - block: *dcmac_channel
    address: 0x03000
    width: 12
    name: ch2

  - block: *dcmac_channel
    address: 0x04000
    width: 12
    name: ch3

  - block: *dcmac_channel
    address: 0x05000
    width: 12
    name: ch4

  - block: *dcmac_channel
    address: 0x06000
    width: 12
    name: ch5

