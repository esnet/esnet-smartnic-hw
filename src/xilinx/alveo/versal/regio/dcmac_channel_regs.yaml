name: dcmac_channel_regs
info: |
  AMD DCMAC Per-Channel Registers (C0-C5 canonical, C0_ prefix stripped).
  Ref: AMD DCMAC Register Map v1.4
  Mount at channel base address: C0=0x01000, C1=0x02000, ..., C5=0x06000.
  Note: stat_tx_ecc_correctable/uncorrectable_count at offsets 0x2D0/0x2D8
    are global registers that reside within C0 address space.
