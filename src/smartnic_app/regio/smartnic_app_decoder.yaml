name: smartnic_app

blocks:
  function: &function
    name: function
    info: |
      This block is a placeholder for the registers in each of the
      smartnic_app functional components - igr, egr, igr_intern and egr_extern
    regs: []

interfaces:
  - block: *function
    address: 0x000000
    width: 19
    name: igr_extern

  - block: *function
    address: 0x080000
    width: 19
    name: egr_extern

  - block: *function
    address: 0x100000
    width: 19
    name: smartnic_app_igr

  - block: *function
    address: 0x180000
    width: 19
    name: smartnic_app_egr

