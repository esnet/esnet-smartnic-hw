name: smartnic_qs
visible: true

blocks:
  smartnic_qs: &smartnic_qs
    !include ../src/smartnic/regio/smartnic_qs.yaml

decoders:
  hbm_stack: &hbm_stack
    !include ../src/xilinx/hbm/regio/xilinx_hbm_decoder.yaml
  packet_q: &packet_q
    !include src/packet/regio/packet_q_decoder.yaml

interfaces:
  - block: *smartnic_qs
    address: 0x0000
    width: 12
    name: control

  - decoder: *hbm_stack
    address: 0x1000
    width: 13
    name: hbm

  - decoder: *packet_q
    address: 0x4000
    width: 13
    name: packet_q
