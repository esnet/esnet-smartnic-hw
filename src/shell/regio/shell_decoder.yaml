name: shell

blocks:
  hw: &hw
    name: hw
    info: Hardware (i.e. physical layer) registers.
    regs: []
  core: &core
    name: core
    info: Core (i.e. user/application) registers.
    regs: []

interfaces:
  - block: *hw
    address: 0x000000
    width: 22
    name: hw
  - block: *core
    address: 0x400000
    width: 22
    name: core
