name: shell

blocks:
  shell_cfg: &shell_cfg
    !include ../src/shell/regio/shell_cfg.yaml
  core: &core
    name: core
    info: Core (i.e. user/application) registers.
    regs: []

decoders:
  hw: &hw
    name: hw
    info: Hardware (i.e. physical layer) registers.
    interfaces: []

interfaces:
  - block: *shell_cfg
    address: 0x000000
    width: 12
    name: shell_cfg

  - decoder: *hw
    address: 0x200000
    width: 21
    name: hw

  - block: *core
    address: 0x400000
    width: 22
    name: core
