# ============================================================================
# Shared configuration
# ============================================================================

# Pipeline and tool environments

include:
  - template: 'Workflows/Branch-Pipelines.gitlab-ci.yml'

stages:
  - p4_sim
  - rtl_sim
  - ip
  - bitfile
  - validate
  - package
  - trigger_downstream

variables:
  GIT_STRATEGY: clone
  SEED: 0
  RANDOMIZE_SEED: 0
  BUILD_ID: $CI_PIPELINE_ID
  SHELL_VALIDATION_REQUIRED: "0"

.common:
  image: $CI_REGISTRY/ht/xilinx-tools-docker:100594-g31ff8c4d
  before_script:
    - if [ $RANDOMIZE_SEED -gt 0 ]; then export SEED=$RANDOM; fi
    - echo "Running pipeline with SEED $SEED..."
  variables:
    XILINXD_LICENSE_FILE: "2100@dmv.es.net"
    # Required to keep click python module happy
    LC_ALL: C.UTF-8
    LANG: C.UTF-8
    GIT_SUBMODULE_STRATEGY: recursive

.common_versal:
  extends: .common
  image: $CI_REGISTRY/ht/xilinx-tools-docker:101657-ga13293eb
  before_script:
    - !reference [.common, before_script]
    - cp -r /tools/AVED/smbus_v1_1 src/xilinx/aved/hw/amd_v80_gen5x8_25.1/src/iprepo/

# Shared console-filter definition for both build flows.
.vivado_logging:
  variables:
    RUN_LOGGED_CONSOLE_FILTER: &vivado_console_filter "$CI_PROJECT_DIR/esnet-fpga-library/scripts/vivado/console_filters/vivado-progress.json"

# Firmware handoff template

.trigger_fw:
  stage: trigger_downstream
  variables:
    SN_HW_GROUP: $CI_PROJECT_NAMESPACE
    SN_HW_REPO: $CI_PROJECT_NAME
    SN_HW_BRANCH: $CI_COMMIT_BRANCH
    SN_HW_APP_NAME: $SN_HW_APP_NAME
    SN_HW_BOARD: $SN_HW_BOARD
    # override the artifact URL in the triggered repo so it pulls directly from the hwapi job from this pipeline
    ESNET_SMARTNIC_HWAPI_URL: "$CI_PROJECT_URL/-/jobs/$SN_HW_HWAPI_JOB_NUMBER/artifacts/download?file_type=archive"
  trigger:
    project: ht/esnet-smartnic-fw
    branch: main
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# ============================================================================
# Simulation
# ============================================================================

# P4 and RTL simulation

p4bm:
  stage: p4_sim
  extends: .common
  tags:
    - ht-sim
  script:
    - make -s -C src/vitisnetp4/p4/sim build sim-all
    - make -s -C examples/p4_only/p4/sim sim-all
    - make -s -C examples/p4_and_verilog/p4/sim build sim-all
    - make -s -C examples/p4_with_extern/p4/sim sim-all
    - make -s -C examples/p4_multi_proc/p4/sim_igr sim-all
    - make -s -C examples/p4_multi_proc/p4/sim_egr sim-all
    - make -s -C examples/sar_test/p4/sim build sim-all
    #- make -s -C examples/fec_test/p4/sim build sim-all
    #- make -s -C examples/udplb_fec/p4/sim_igr sim-all
    #- make -s -C examples/udplb_fec/p4/sim_egr sim-all
    - make -s -C examples/udplb_fec_av80/p4/sim_igr sim-all
    - make -s -C examples/udplb_fec_av80/p4/sim_egr sim-all
  artifacts:
    name: "artifacts.$CI_PROJECT_NAME.$CI_JOB_NAME.$CI_PIPELINE_ID"
    paths:
      - src/vitisnetp4/p4/sim
      - examples/p4_only/p4/sim
      - examples/p4_and_verilog/p4/sim
      - examples/p4_with_extern/p4/sim
      - examples/p4_multi_proc/p4/sim_igr
      - examples/p4_multi_proc/p4/sim_egr
      - examples/sar_test/p4/sim
      #- examples/fec_test/p4/sim
      #- examples/udplb_fec/p4/sim
      - examples/udplb_fec_av80/p4/sim
  needs: []

sim_p4_apps:
  stage: rtl_sim
  extends: .common
  tags:
    - ht-sim
  script:
    - make -s -C src/p4_proc/tests/regression
    - grep 'PASSED.*suites passing' src/p4_proc/tests/regression/run_$SEED/sim.log
    - make -s -C src/smartnic_app/tests/regression
    - grep 'PASSED.*suites passing' src/smartnic_app/tests/regression/run_$SEED/sim.log
    - make -s -C examples/p4_multi_proc config
    - make -s -C examples/p4_multi_proc/tests/regression
    - grep 'PASSED.*suites passing' examples/p4_multi_proc/tests/regression/run_$SEED/sim.log
    - make -s -C examples/p4_and_verilog/tests/regression
    - grep 'PASSED.*suites passing' examples/p4_and_verilog/tests/regression/run_$SEED/sim.log
#    - make -s -C examples/sar_test/tests/regression
#    - grep 'PASSED.*suites passing' examples/sar_test/tests/regression/run_$SEED/sim.log
#    - make -s -C examples/fec_test/tests/regression
#    - grep 'PASSED.*suites passing' examples/fec_test/tests/regression/run_$SEED/sim.log
#    - make -s -C examples/udplb_fec/tests/regression
#    - grep 'PASSED.*suites passing' examples/udplb_fec/tests/regression/run_$SEED/sim.log
    - make -s -C examples/udplb_fec_av80/tests/regression
    - grep 'PASSED.*suites passing' examples/udplb_fec_av80/tests/regression/run_$SEED/sim.log
  artifacts:
    name: "artifacts.$CI_PROJECT_NAME.$CI_JOB_NAME.$CI_PIPELINE_ID"
    reports:
      junit:
        - src/p4_proc/tests/regression/run_*/tests.xml
        - src/smartnic_app/tests/regression/run_*/tests.xml
        - examples/p4_multi_proc/tests/regression/run_*/tests.xml
        - examples/p4_and_verilog/tests/regression/run_*/tests.xml
        - examples/sar_test/tests/regression/run_*/tests.xml
#        - examples/fec_test/tests/regression/run_*/tests.xml
#        - examples/udplb_fec/tests/regression/run_*/tests.xml
        - examples/udplb_fec_av80/tests/regression/run_*/tests.xml
    when: always
  timeout: 4h
  needs: []

sim_platform:
  stage: rtl_sim
  extends: .common
  tags:
    - ht-sim
  script:
    - make -s -C src/smartnic/tests/top/regression
    - grep 'PASSED.*suites passing' src/smartnic/tests/top/regression/run_$SEED/sim.log
    - make -s -C src/smartnic/tests/block/regression
    - grep 'PASSED.*suites passing' src/smartnic/tests/block/regression/run_$SEED/sim.log
    - make -s -C src/smartnic/core/tests/regression
