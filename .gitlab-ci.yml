  extends: .common
  tags:
    - ht-sim
  script:
    - |
      cat <<_EOF | tee dependencies.txt
      VIVADO_VERSION=$VIVADO_VERSION
      $(git submodule status --recursive | awk '{ print $1,$2 }')
      _EOF
    - |
      cat <<_EOF | tee cache_key.env
      SHELL_IP_CACHE_KEY=$(sha1sum dependencies.txt | awk '{ print $1 }')
      _EOF
  artifacts:
    reports:
      dotenv:
        cache_key.env
  needs: []

.shell_ip:
  stage: ip
  extends: .common
  variables:
    RUN_LOGGED_CONSOLE_FILTER: *vivado_console_filter
  tags:
    - ht-synth
  script:
    - |
      python3 esnet-fpga-library/scripts/run_logged.py \
          --log examples/esnet_shell/build/$SN_HW_BOARD/out/validation-inputs/ip.log \
          -- bash -euo pipefail -c '
          make -s -C examples/esnet_shell config BOARD=$SN_HW_BOARD
          make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src refresh BOARD=$SN_HW_BOARD
          make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src synth COMPONENT=xilinx.alveo.usplus.shell.rtl@smartnic BOARD=$SN_HW_BOARD
          '
  artifacts:
    paths:
      - examples/esnet_shell/build/$SN_HW_BOARD/out
    when: always
  cache: &shell_ip_cache
    key: cache-shell_ip-native-$VIVADO_VERSION-$SN_HW_BOARD-$SHELL_IP_CACHE_KEY
    paths:
      - examples/esnet_shell/build/$SN_HW_BOARD/out
    policy: pull-push
  timeout: 4h
  needs:
    - shell_ip_cache_key

.shell_ip_versal:
  extends:
    - .shell_ip
    - .common_versal
  script:
    - |
      python3 esnet-fpga-library/scripts/run_logged.py \
          --log examples/esnet_shell/build/$SN_HW_BOARD/out/validation-inputs/ip.log \
          -- bash -euo pipefail -c '
          make -s -C examples/esnet_shell config BOARD=$SN_HW_BOARD BUILD_ID=$BUILD_ID
          make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src refresh BOARD=$SN_HW_BOARD
          make -s -C src/xilinx/alveo/versal/bd _bd_refresh BOARD=$SN_HW_BOARD LIB_OUTPUT_ROOT=$CI_PROJECT_DIR/examples/esnet_shell/build/$SN_HW_BOARD/out/smartnic BUILD_ID=$BUILD_ID
          make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src synth COMPONENT=xilinx.alveo.versal.bd@smartnic BOARD=$SN_HW_BOARD BUILD_ID=$BUILD_ID
          make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src synth COMPONENT=xilinx.alveo.versal.shell.rtl@smartnic BOARD=$SN_HW_BOARD BUILD_ID=$BUILD_ID
          '
  timeout: 8h

shell_ip_au280:
  extends: .shell_ip
  variables:
    SN_HW_BOARD: au280
  rules:
    - when: manual
      allow_failure: true

shell_ip_au55c:
  extends: .shell_ip
  variables:
    SN_HW_BOARD: au55c
  rules:
    - when: manual
      allow_failure: true

shell_ip_au250:
  extends: .shell_ip
  variables:
    SN_HW_BOARD: au250
  rules:
    - when: manual
      allow_failure: true

shell_ip_av80:
  extends: .shell_ip_versal
  variables:
    SN_HW_BOARD: av80

# Image, validation and packaging templates

.shell_image:
  variables:
    RUNNER_SCRIPT_TIMEOUT: 10h
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1h
    RUN_LOGGED_CONSOLE_FILTER: *vivado_console_filter
    SN_HW_APP_DIR: $SN_HW_APP_NAME
  stage: bitfile
  tags:
    - ht-synth
  script:
    - |
      cat <<_EOF >> shell_image.env
      EXAMPLES_DIR=$EXAMPLES_DIR
      SN_HW_APP_NAME=$SN_HW_APP_NAME
      SN_HW_APP_DIR=$SN_HW_APP_DIR
      SN_HW_BOARD=$SN_HW_BOARD
      SN_HW_BUILD_JOB_NUMBER=$CI_JOB_ID
      _EOF
    - cat shell_image.env
    - make -s -C $EXAMPLES_DIR/$SN_HW_APP_DIR image BOARD=$SN_HW_BOARD
    - make -s -C $EXAMPLES_DIR/$SN_HW_APP_DIR reg_package BOARD=$SN_HW_BOARD
    - make -s -C $EXAMPLES_DIR/$SN_HW_APP_DIR p4_driver BOARD=$SN_HW_BOARD
  after_script:
    - |
      validation_dir="$EXAMPLES_DIR/$SN_HW_APP_DIR/build/$SN_HW_BOARD/validation"
      if [ "$CI_JOB_STATUS" = "success" ]; then
        mkdir -p "$validation_dir"
        if make -s -C "$EXAMPLES_DIR/$SN_HW_APP_DIR" validate BOARD="$SN_HW_BOARD"; then
          validation_status=0
        else
          validation_status=$?
        fi
        printf '%s\n' "$validation_status" > "$validation_dir/ci-$CI_JOB_ID.exitcode"
      fi
      python3 esnet-fpga-library/scripts/vivado/build_summary.py \
        --name "$SN_HW_APP_DIR/$SN_HW_BOARD" --status "$CI_JOB_STATUS" \
        --timing-report "$validation_dir/timing.rpt"
  artifacts:
    name: "artifacts.$CI_PROJECT_NAME.$CI_JOB_NAME.$CI_PIPELINE_ID"
    paths:
      - $EXAMPLES_DIR/$SN_HW_APP_DIR/build
    when: always
    expire_in: 2 weeks
    reports:
      dotenv: shell_image.env
  needs: []
  when: on_success
  timeout: 11h 15m

.shell_image_usplus:
  extends:
    - .common
    - .shell_image
  before_script:
    - !reference [.common, before_script]
    - make -s -C examples/esnet_shell config BOARD=$SN_HW_BOARD
    - make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src refresh BOARD=$SN_HW_BOARD
  cache:
    <<: *shell_ip_cache
    policy: pull
  needs:
    - shell_ip_cache_key

.shell_image_versal:
  extends:
    - .common_versal
    - .shell_image
  before_script:
    - !reference [.common_versal, before_script]
    - make -s -C examples/esnet_shell config BOARD=$SN_HW_BOARD BUILD_ID=$BUILD_ID
    - make -s -C examples/esnet_shell/build/$SN_HW_BOARD/src refresh BOARD=$SN_HW_BOARD
    # Other examples reuse the prepared Xilinx tree at its original paths.
    - |
      shell_xilinx="$CI_PROJECT_DIR/examples/esnet_shell/build/$SN_HW_BOARD/out/smartnic/xilinx"
      app_xilinx="$CI_PROJECT_DIR/$EXAMPLES_DIR/$SN_HW_APP_DIR/build/$SN_HW_BOARD/out/smartnic/xilinx"
      test -d "$shell_xilinx"
      if [ "$app_xilinx" != "$shell_xilinx" ]; then
          mkdir -p "$(dirname "$app_xilinx")"
          ln -srT "$shell_xilinx" "$app_xilinx"
      fi
  artifacts:
    paths:
      - $EXAMPLES_DIR/$SN_HW_APP_DIR/build
      - examples/esnet_shell/build/$SN_HW_BOARD/out
  cache:
    <<: *shell_ip_cache
    policy: pull
  needs:
    - job: shell_ip_cache_key
      artifacts: true
    - job: shell_ip_av80
      artifacts: true

.validate_shell:
  extends: .common
  stage: validate
  before_script: []
  tags:
    - ht-misc
  script:
    - |
      validation_dir="$EXAMPLES_DIR/$SN_HW_APP_DIR/build/$SN_HW_BOARD/validation"
      python3 esnet-fpga-library/scripts/vivado/validation/validate_build.py \
        --summary-only --output-dir "$validation_dir" \
        --status-file "$validation_dir/ci-${SN_HW_BUILD_JOB_NUMBER:-missing}.exitcode"
  artifacts:
    when: always
    paths:
      - $EXAMPLES_DIR/$SN_HW_APP_DIR/build/$SN_HW_BOARD/validation
    reports:
      junit: $EXAMPLES_DIR/$SN_HW_APP_DIR/build/$SN_HW_BOARD/validation/junit.xml
    expire_in: 2 weeks
  rules:
    - if: '$SHELL_VALIDATION_REQUIRED == "1"'
      allow_failure: false
    - when: on_success
      allow_failure: true
  timeout: 30m

.hwapi_shell:
  stage: package
  extends: .common
  tags:
    - ht-misc
  before_script: []
  script:
    - echo "$EXAMPLES_DIR $SN_HW_APP_NAME $SN_HW_BOARD"
    - |
      cat <<_EOF >> hwapi.env
      SN_HW_HWAPI_JOB_NUMBER=$CI_JOB_ID
      SN_HW_APP_NAME=$SN_HW_APP_NAME
      SN_HW_BOARD=$SN_HW_BOARD
      SN_HW_COMMIT=$CI_COMMIT_SHORT_SHA
      _EOF
    - cat hwapi.env
    - make -s -C $EXAMPLES_DIR/$SN_HW_APP_DIR hwapi BOARD=$SN_HW_BOARD SHELL_HWAPI_DIR=${CI_PROJECT_DIR}/esnet-smartnic-hwapi/${SN_HW_BOARD} SHELL_HW_TEST_FILE=${CI_PROJECT_DIR}/robot-framework-test.tar.bz2

  artifacts:
    name: "artifacts.$SN_HW_BOARD.$SN_HW_APP_NAME.$CI_PIPELINE_ID"
    paths:
      - esnet-smartnic-hwapi
      - robot-framework-test.tar.bz2
    when: always
    expire_in: 3 month
    reports:
      dotenv: hwapi.env
  timeout: 30m

