# ============================================================================
# Bootstrap handoff (ONS UltraScale+ and native ESnet V80)
# ============================================================================

# Combined shell bundle and bootstrap trigger

.hwapi_gather:
  stage: package
  extends: .common
  tags:
    - ht-misc
  before_script: []
  script:
    # GitLab extracts all needed artifacts into this workspace, merging board directories.
    - test -d esnet-smartnic-hwapi
    - |
      cat <<_EOF > hwapi.env
      SN_HW_HWAPI_JOB_NUMBER=$CI_JOB_ID
      SN_HW_APP_NAME=$SN_HW_APP_NAME
      SN_HW_BOARD=multi
      SN_HW_COMMIT=$CI_COMMIT_SHORT_SHA
      _EOF
    - cat hwapi.env
  artifacts:
    name: "artifacts.$SN_HW_APP_NAME.$CI_PIPELINE_ID"
    paths:
      - esnet-smartnic-hwapi
      - robot-framework-test.tar.bz2
    expire_in: 3 month
    reports:
      dotenv: hwapi.env
  timeout: 30m

hwapi_shell:
  extends: .hwapi_gather
  variables:
    SN_HW_APP_NAME: shell
  needs:
    - job: hwapi_shell_au280
      artifacts: true
    - job: hwapi_shell_au55c
      artifacts: true
    - job: hwapi_esnet_shell_av80
      artifacts: true

trigger_bootstrap:
  stage: trigger_downstream
  variables:
    SN_HW_GROUP: $CI_PROJECT_NAMESPACE
    SN_HW_REPO: $CI_PROJECT_NAME
    SN_HW_BRANCH: $CI_COMMIT_BRANCH
    SN_HW_APP_NAME: shell
    SN_HW_BOARD: multi
    SN_HW_API_JOB: hwapi_shell
    # override the artifact URL in the triggered repo so it pulls directly from the hwapi job from this pipeline
    ESNET_SMARTNIC_HWAPI_URL: "$CI_PROJECT_URL/-/jobs/$SN_HW_HWAPI_JOB_NUMBER/artifacts/download?file_type=archive"
  trigger:
    project: ht/esnet-smartnic-bootstrap
    branch: main
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  needs:
    - job: hwapi_shell
      artifacts: true
