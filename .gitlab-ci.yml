    - make -s -C src/xilinx/pci/tests/regression
    - grep 'PASSED.*suites passing' src/xilinx/pci/tests/regression/run_$SEED/sim.log
  artifacts:
    name: "artifacts.$CI_PROJECT_NAME.$CI_JOB_NAME.$CI_PIPELINE_ID"
    reports:
      junit:
        - src/smartnic/tests/top/regression/run_*/tests.xml
        - src/smartnic/tests/block/regression/run_*/tests.xml
        - src/smartnic/core/tests/regression/run_*/tests.xml
        - src/smartnic_app/tests.smartnic/regression/run_*/tests.xml
        - examples/p2p/tests.smartnic/regression/run_*/tests.xml
        - src/smartnic_250mhz/tests/regression/run_*/tests.xml
        - src/xilinx/cms/tests/regression/run_*/tests.xml
        - src/xilinx/pci/tests/regression/run_*/tests.xml
    when: always
  timeout: 8h
  needs: []

# ============================================================================
# OpenNIC Shell (ONS) flow
# ============================================================================

# IP preparation

ons_ip_cache_key:
  stage: ip
  extends: .common
  tags:
    - ht-sim
  script:
    - |
      cat <<_EOF | tee dependencies.txt
      VIVADO_VERSION=$VIVADO_VERSION
      $(git submodule status -- open-nic-shell | awk '{ print $1,$2 }')
      _EOF
    - |
      cat <<_EOF | tee cache_key.env
      ONS_IP_CACHE_KEY=$(sha1sum dependencies.txt | awk '{ print $1 }')
      _EOF
  artifacts:
    reports:
      dotenv:
        cache_key.env
  needs: []

.ons_ip:
  stage: ip
  extends: .common
  variables:
    RUN_LOGGED_CONSOLE_FILTER: *vivado_console_filter
  tags:
    - ht-synth
  script:
    - |
      python3 esnet-fpga-library/scripts/run_logged.py \
          --log ci-logs/$CI_JOB_NAME.log \
          -- make -f makefile.esnet project_ip BOARD=$SN_HW_BOARD
  artifacts:
    paths:
      - open-nic-shell/build
      - ci-logs
    when: always
  cache:
    - key: cache-ons_ip-$SN_HW_BOARD-$ONS_IP_CACHE_KEY
      paths:
        - open-nic-shell/build
  timeout: 4h
  needs:
    - ons_ip_cache_key

.smartnic_ip:
  stage: ip
  extends: .common
  variables:
    RUN_LOGGED_CONSOLE_FILTER: *vivado_console_filter
  tags:
    - ht-synth
  script:
    - |
      python3 esnet-fpga-library/scripts/run_logged.py \
          --log ci-logs/$CI_JOB_NAME.log \
          -- bash -euo pipefail -c '
          make -s -C src synth COMPONENT=smartnic_250mhz.build BOARD=$SN_HW_BOARD
          make -s -C src synth COMPONENT=smartnic.build BOARD=$SN_HW_BOARD
          make -s -C src synth COMPONENT=smartnic_app.build BOARD=$SN_HW_BOARD
          '
  artifacts:
    paths:
      - .out
      - ci-logs
    when: always
  timeout: 2h
  needs: []

ons_ip_au280:
  extends: .ons_ip
  variables:
    SN_HW_BOARD: au280

ons_ip_au55c:
  extends: .ons_ip
  variables:
    SN_HW_BOARD: au55c

ons_ip_au250:
